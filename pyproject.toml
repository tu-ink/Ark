[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arkids"
# 版本由 src/arkids/version.py 单一来源动态读取
dynamic = ["version"]
description = "基于人工智能的网络攻击智能检测与防御系统(ArkIDS) —— AI 流量检测 + 证据累积式智能防御 + 可视化控制台"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["intrusion-detection", "network-security", "machine-learning", "ai-defense", "ids"]
authors = [{ name = "tu-ink", email = "2538503336@qq.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/tu-ink/Ark"
Repository = "https://github.com/tu-ink/Ark"
Documentation = "https://github.com/tu-ink/Ark#readme"

[project.scripts]
arkids = "arkids.cli:main"

[project.entry-points."arkids.plugins"]
# 预留插件/扩展入口(当前无内置插件)

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arkids*"]

[tool.setuptools.package-data]
arkids = ["webui/*.html", "webui/*.css", "webui/*.js", "webui/*.ico"]

[tool.setuptools.dynamic]
version = { attr = "arkids.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
